aid: centrical
name: Centrical
description: 'Centrical (legally Biz-Effective Ltd., founded in Israel in 2013 and known as GamEffective
  until its 2019 rebrand) sells a performance-experience platform for frontline and contact-center
  employees. The product combines advanced gamification, personalized microlearning, real-time
  performance management, AI-assisted coaching, quality management and voice-of-the-employee
  surveys into a single agent-facing experience, and is used by Microsoft, Verizon Cellular Sales,
  Teleperformance, Hilton and Synchrony among others. Centrical is integration-heavy rather than
  developer-facing: it ingests KPI and activity data from CRM, POS, telephony, WFM, VoC and
  contact-center systems (including a packaged Amazon Connect / Contact Lens integration, a
  Salesforce AppExchange listing and a Microsoft Teams app) over API, SFTP and email. That data
  and integration API is documented for contracted customers only — Centrical publishes no public
  developer portal, API reference, or machine-readable contract.'
