note: >-
  Centrical operates a real, public Atlassian Statuspage that is NOT linked from centrical.com — the
  197-page marketing sitemap contains no status, developer or docs page, so this was found by probing
  the vendor's statuspage.io subdomain rather than from any published link. It is the only public
  operational surface Centrical serves, and it is the strongest public evidence that a production API
  exists: three of its regional component groups each list a "Core Api" component, and the "Web
  Application" component is described by Centrical as "Front End, Admin Console and Management API".
  No versioning policy, deprecation policy, Sunset/Deprecation header support, SLA document or public
  changelog was found — those live in the customer-only Zendesk help center (401/403 anonymously).

