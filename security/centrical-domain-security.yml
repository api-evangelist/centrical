generated: '2026-08-10'
method: probed
source: live DNS/TLS/HTTP probes of apis.yml + OpenAPI hosts
note: >-
  The centrical.com row is written by 0-working/probe-domain-security.py from apis.yml. The
  centrical.me rows were measured by hand on 2026-08-10 with the same method (openssl s_client for
  TLS version and cert expiry, HEAD for HSTS, dig for DS/CAA/SPF/DMARC) after a DNS sweep found
  Centrical's production application and API hosts on its second domain, which apis.yml does not
  reference. Two findings worth naming: centrical.com sets an HSTS max-age of only 300 seconds
  (5 minutes), which is far too short to offer real protection and below the 31536000 the
  centrical.me app hosts use; and api.centrical.me — the production API host — sends no HSTS header
  at all. Neither domain publishes DNSSEC or CAA.

hosts:
- host: centrical.com
  role: marketing site (WordPress)
  https: true
  tls_version: TLSv1.3
  cert_expires: Sep 30 12:47:49 2026 GMT
  hsts: true
  hsts_max_age: 300
  hsts_include_subdomains: false
  note: HSTS max-age of 300s is effectively non-protective.
- host: api.centrical.me
  role: production API host (AWS API Gateway, us-east-1)
  https: true
  tls_version: TLSv1.3
  cert_expires: Feb  1 23:59:59 2027 GMT
  cert_issuer: Amazon RSA 2048 M01
  hsts: false
  hsts_max_age: null
  note: No Strict-Transport-Security header on the API host.
- host: app.centrical.me
  role: tenant customer application (CloudFront)
  https: true
  tls_version: TLSv1.3
  cert_expires: Nov 30 23:59:59 2026 GMT
  hsts: true
  hsts_max_age: 31536000
  hsts_include_subdomains: true
- host: docs.centrical.me
  role: tenant customer application (CloudFront)
  https: true
  tls_version: TLSv1.3
  cert_expires: Nov 30 23:59:59 2026 GMT
  hsts: true
  hsts_max_age: 31536000
  hsts_include_subdomains: true
- host: powerup.centrical.me
  role: mobile/PowerUp client SPA (CloudFront)
  https: true
  tls_version: TLSv1.3
  cert_expires: Nov 30 23:59:59 2026 GMT
  hsts: true
  hsts_max_age: 31536000
  hsts_include_subdomains: true

domains:
- domain: centrical.com
  dnssec: false
  caa: []
  spf: true
  dmarc: true
  dmarc_policy: quarantine
- domain: centrical.me
  dnssec: false
  caa: []
  spf: true
  spf_record: 'v=spf1 include:spf.protection.outlook.com include:spf.mandrillapp.com include:mail.zendesk.com -all'
  dmarc: true
  dmarc_policy: quarantine
  dmarc_rua: dmarc-reports@centrical.me
