generated: '2026-08-10'
method: probed
source: live GET probes of every Centrical host reachable without credentials
note: >-
  No /.well-known/ discovery surface is published on any Centrical host, and no file was saved
  because nothing returned a real document. NO `WellKnown` or `SecurityTxt` pointer is emitted in
  apis.yml — this file records an ABSENCE, and a pointer would assert that Centrical serves a
  discovery surface it does not.

  Round 2 (2026-08-10) added the centrical.me hosts, which round 1 missed entirely: a DNS sweep found
  api.centrical.me (an AWS API Gateway custom domain), app.centrical.me, docs.centrical.me and
  status.centrical.me. api.centrical.me is a LIVE production API host — it answers every anonymous
  request with an AWS API Gateway `ForbiddenException`, which is a rejection by a real API, not a
  missing host. That is the single strongest piece of evidence that Centrical operates an API and
  gates it entirely.

  Three soft-200 traps are recorded explicitly and rejected: powerup.centrical.me answers 200 with an
  SPA HTML shell for every path; centrical.com is WordPress and returns an HTML 404 page; and
  centrical.instatus.com returns 200 only because instatus.com redirects unknown subdomains to its
  own homepage. None is a document.

hosts:
- host: https://api.centrical.me
  role: production API host (AWS API Gateway custom domain, us-east-1)
  note: >-
    Every path returns HTTP 403 `{"message":"Forbidden"}` with `x-amzn-errortype: ForbiddenException`
    except /v1/*, which returns `{"message":"Missing Authentication Token"}` — both are AWS API
    Gateway rejections. The API exists; anonymous discovery is impossible.
  documents:
  - {path: /, status: 403, content_type: application/json, body: '{"message":"Forbidden"}'}
  - {path: /openapi.json, status: 403}
  - {path: /openapi.yaml, status: 403}
  - {path: /swagger.json, status: 403}
  - {path: /v1/openapi.json, status: 403, body: '{"message":"Missing Authentication Token"}'}
  - {path: /api-docs, status: 403}
  - {path: /docs, status: 403}
  - {path: /redoc, status: 403}
  - {path: /graphql, status: 403}
  - {path: /llms.txt, status: 403}
  - {path: /.well-known/security.txt, status: 403}
  - {path: /.well-known/openid-configuration, status: 403}
  - {path: /.well-known/oauth-authorization-server, status: 403}
  - {path: /.well-known/oauth-protected-resource, status: 403}
  - {path: /.well-known/api-catalog, status: 403}
  - {path: /.well-known/agent-card.json, status: 403}
  - {path: /.well-known/agent.json, status: 403}
- host: https://docs.centrical.me
  role: tenant-scoped customer application (NOT developer documentation)
  note: >-
    Despite the hostname this is not a docs site. It 302s to /error/notenant — it is the Centrical
    product app resolved per tenant, and without a tenant subdomain context it errors. Unknown paths
    return a 200 HTML error shell.
  documents:
  - {path: /, status: 302, location: /error/notenant}
  - {path: /openapi.json, status: 200, content_type: 'text/html', accepted: false, note: HTML error shell, does not parse as OpenAPI — rejected}
  - {path: /llms.txt, status: 200, content_type: 'text/html', accepted: false, note: HTML error shell — rejected}
  - {path: /api-docs, status: 200, content_type: 'text/html', accepted: false, note: HTML error shell — rejected}
- host: https://app.centrical.me
  role: tenant-scoped customer application
  documents:
  - {path: /, status: 302, location: /error/notenant}
- host: https://powerup.centrical.me
  role: mobile/PowerUp client SPA
  documents:
  - {path: /, status: 302, location: /m/index.html}
  - {path: /.well-known/agent-card.json, status: 200, content_type: 'text/html', accepted: false, note: SPA catch-all HTML shell, not an agent card — rejected per the A2A probe rule}
  - {path: /.well-known/agent.json, status: 200, content_type: 'text/html', accepted: false, note: SPA catch-all HTML shell — rejected}
  - {path: /openapi.json, status: 200, content_type: 'text/html', accepted: false, note: SPA catch-all HTML shell — rejected}
- host: https://centrical.com
  role: WordPress marketing site
  note: 404 handler returns an HTML page for every unknown path, so each row is a genuine miss.
  documents:
  - {path: /.well-known/security.txt, status: 404}
  - {path: /.well-known/openid-configuration, status: 404}
  - {path: /.well-known/oauth-authorization-server, status: 404}
  - {path: /.well-known/oauth-protected-resource, status: 404}
  - {path: /.well-known/api-catalog, status: 404}
  - {path: /.well-known/ai-plugin.json, status: 404}
  - {path: /.well-known/agent-card.json, status: 404}
  - {path: /.well-known/agent.json, status: 404}
  - {path: /llms.txt, status: 404}
  - {path: /openapi.json, status: 404}
  - {path: /swagger.json, status: 404}
  - {path: /api-docs, status: 404}
  - {path: /graphql, status: 404}
- host: https://support.centrical.com
  role: Zendesk help center (gameffective.zendesk.com), customer-only
  documents:
  - {path: /.well-known/security.txt, status: 302, note: Zendesk redirects every unknown path to /hc}
  - {path: /.well-known/agent-card.json, status: 302}
  - {path: /.well-known/agent.json, status: 302}
  - {path: /hc/en-us, status: 403, note: help center web UI requires sign-in}
  - {path: /api/v2/help_center/en-us/articles.json, status: 401, body: '{"error":"Couldn''t authenticate you"}'}
  - {path: /api/v2/help_center/en-us/categories.json, status: 401}
- host: https://centrical.statuspage.io
  role: Atlassian Statuspage — the ONLY public machine-readable Centrical surface found
  note: >-
    Statuspage does not serve /.well-known/, but its v2 API is public JSON and IS a real document.
    Captured in lifecycle/centrical-lifecycle.yml rather than saved here.
  documents:
  - {path: /api/v2/summary.json, status: 200, content_type: application/json, accepted: true}
  - {path: /api/v2/incidents.json, status: 200, content_type: application/json, accepted: true}
  - {path: /api/v2/components.json, status: 200, accepted: true}
  - {path: /history.rss, status: 200, accepted: true}

